# Global parameters
[global]
	dns forwarder = 10.10.1.1
	netbios name = DC-VTECH
	realm = VTECH.LOCAL
	server role = active directory domain controller
	workgroup = VTECH
        log level = 1 auth_audit:3 dsdb_audit:3
	idmap_ldb:use rfc2307 = yes

[sysvol]
	path = /var/lib/samba/sysvol
	read only = No

[netlogon]
	path = /var/lib/samba/sysvol/vtech.local/scripts
	read only = No
